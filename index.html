<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON User Profile Card</title>
    <!-- 1. Link our CSS style sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 2. The container where our card will sit -->
    <div class="card-container">
        <div class="profile-card">
            <h2 id="user-name">Loading Name...</h2>
            <p class="email-label">Email:</p>
            <p id="user-email" class="email-text">Loading Email...</p>
            <p class="city-label">Location:</p>
            <p id="user-city" class="city-text">Loading City...</p>
            <span id="badge" class="badge">Status</span>
        </div>
    </div>

    <!-- 3. Link our frontend JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
